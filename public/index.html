<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a2266">
<title>SMU Softball Trainings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
/* Member view: one phone-width column of training cards, big tap targets for replying. */
main.member{max-width:560px}
.who{display:grid;gap:6px}
.who button{justify-content:flex-start;text-align:left;padding:12px 14px;font-size:16px;font-weight:500;min-height:48px}
.who button[aria-pressed="true"]{background:var(--field);border-color:var(--field);color:var(--field-ink)}
input.big{font-size:18px;padding:12px 14px;min-height:50px}
.hello{display:flex;align-items:center;gap:12px}
.hello .hi{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.hello .row{margin-left:auto;gap:6px}
.hello .avbtn{padding:0;min-height:0;border:0;background:none;border-radius:50%}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.dtile{display:grid;justify-items:center;width:60px;padding:7px 0 8px;border-radius:14px;background:var(--tint);color:var(--field);line-height:1}
.dtile .dw{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.dtile .dn{font-family:var(--display);font-weight:700;font-size:26px;margin:3px 0 2px;color:var(--ink)}
.dtile .dm{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr-title{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.tr-meta{display:flex;gap:4px 12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:3px}
.tr-meta span{display:inline-flex;align-items:center;gap:5px}
.tr-meta svg{width:15px;height:15px;flex:none;opacity:.8}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rsvp button{padding:13px 10px;min-height:52px;font-size:16px;border-radius:14px;border-width:1.5px}
.rsvp .y[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on-status)}
.rsvp .n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on-status)}
.rsvp2{display:flex;gap:8px;flex-wrap:wrap}
.rsvp2 button{flex:1;padding:8px 10px;font-size:14px;border-radius:12px}
.rsvp2 button[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.rform{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.rform .g{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px}
.mynote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--sunk)}
.going{display:flex;align-items:center;gap:10px}
.going summary{flex:1}
.going-list{display:flex;flex-wrap:wrap;gap:6px}
.going-list .chip{padding:3px 10px 3px 3px;font-size:13px;min-height:30px}
.going-list .chip .av{margin-left:0}
.myteam{border-radius:14px;padding:14px;display:grid;gap:8px;background:color-mix(in srgb,var(--tc) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 35%,transparent)}
.myteam.t0{background:color-mix(in srgb,var(--ta) 10%,var(--surface));border-color:color-mix(in srgb,var(--ta) 35%,transparent)}
.myteam.t1{background:color-mix(in srgb,var(--tb) 10%,var(--surface));border-color:color-mix(in srgb,var(--tb) 35%,transparent)}
.myteam .tname{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:16px}
.myteam .tname::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--tc)}
.myteam.t0 .tname::before{background:var(--ta)} .myteam.t1 .tname::before{background:var(--tb)}
.myteam.plain{background:var(--sunk);border-color:var(--line)}
.plan-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.plan-row:first-child{border-top:0}
.plan-row .time{padding-top:1px}
.names{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
.prof{display:flex;align-items:center;gap:14px}
.prof .nm{font-family:var(--display);font-weight:700;font-size:17px}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-btns label{cursor:pointer}
.photo-btns input{display:none}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="ball" aria-hidden="true"></span><span>SMU Softball</span></div>
</div></header>
<main class="wrap member" id="app"><section class="card"><h2>Loading trainings</h2><p class="muted">Upcoming trainings will show here in a moment.</p></section></main>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/member.js"></script>
</body>
</html>
