<main class="wrap" id="app"><div class="card"><h2>Loading team data</h2><p class="muted">Members, drills and saved plans will appear here in a moment.</p></div></main>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { db, auth, configured, currentUser, logOut, telegramEnabled, owner } from './js/store.js';
const VENUES=[{id:'MPSH',label:'MPSH (hall)',kind:'MPSH',from:'15:30',to:'18:00'},{id:'Kallang',label:'Kallang field',kind:'Field',from:'15:30',to:'18:00'},{id:'Jurong',label:'Jurong field',kind:'Field',from:'15:30',to:'18:00'}];
const venueOf=id=>VENUES.find(v=>v.id===id)||VENUES[0];
/* problems with the venue's booked slot, as sentences */
function slotIssues(d){const v=venueOf(d.venue),out=[];const planEnd=toMin(d.start)+d.blocks.reduce((s,b)=>s+blockMin(b),0);
  if(toMin(d.start)<toMin(v.from))out.push(`Starts at ${fmt(toMin(d.start))}, before the ${v.label} slot opens at ${fmt(toMin(v.from))}.`);
  if(planEnd>toMin(v.to))out.push(`The timeline runs until ${fmt(planEnd)}, ${planEnd-toMin(v.to)} min past the ${v.label} slot, which ends at ${fmt(toMin(v.to))}.`);
  else if(toMin(d.end)>toMin(v.to))out.push(`The end time is ${fmt(toMin(d.end))}, after the ${v.label} slot ends at ${fmt(toMin(v.to))}.`);
  return out}
const CATS=[['warmup','Warm-up'],['batting','Batting'],['fielding','Fielding'],['pitching','Pitching & catching'],['game','Game'],['fun','Fun finisher'],['admin','Setup & tear-down']];
const CAT=Object.fromEntries(CATS);
const LEVELS=['','New','Developing','Solid','Strong','Standout'];
const POS=[['P','Pitcher'],['C','Catcher'],['IF','Infield'],['OF','Outfield']];
const TEAM=['A','B','C'];
const GENDER=[['F','Female'],['M','Male']];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const venueKind=id=>(VENUES.find(v=>v.id===id)||VENUES[0]).kind;
const venueLabel=id=>(VENUES.find(v=>v.id===id)||{label:id}).label;
const toMin=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const fmt=m=>{const h=Math.floor(m/60),mm=((m%60)+60)%60;return (((h+11)%12)+1)+':'+String(mm).padStart(2,'0')};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dow=s=>new Date(s+'T12:00:00').getDay();
const pretty=s=>new Date(s+'T12:00:00').toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'});
const rid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const blockMin=b=>b.kind==='rotation'?(+b.per||0)*b.stations.length:(+b.minutes||0);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const byOrder=(a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(b.name);

function nextTraining(){const d=new Date();for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()===3||x.getDay()===5)return iso(x)}return iso(d)}

const S={db:null,user:null,links:{},roster:{},rsvps:{},rinfo:{},offline:false,readOnly:false,status:'loading',ready:{m:0,d:0,s:0},luTeam:0,luView:'field',sel:null,drag:null,suppressClick:false,
  members:[],drills:[],sessions:{},view:'plan',draft:null,dirty:false,blocksEdited:false,
  mf:null,df:null,paste:'',pasteMsg:'',confirm:null,admins:[],reqs:[],exCode:'',exName:'',planDate:null,calMonth:null,calSel:null};
S.calSel=nextTraining();S.calMonth=S.calSel.slice(0,7);

function newMemberForm(){return {id:null,name:'',level:3,pos:[],gender:'',tg:''}}
const tgNorm=s=>String(s||'').trim().replace(/^@/,'').replace(/^https?:\/\/t\.me\//i,'').toLowerCase();
const tgOk=u=>/^[a-z0-9_]{4,32}$/.test(u);
function newDrillForm(){return {id:null,name:'',minutes:15,category:'fielding',venues:['MPSH','Field'],station:false,auto:true,notes:''}}
S.mf=newMemberForm();S.df=newDrillForm();

/* ---------- plan building ---------- */
function newDraft(date){
  const venue=dow(date)===5?'Kallang':'MPSH';
  const d={date,venue,start:'15:30',end:'18:00',numTeams:venueKind(venue)==='MPSH'?3:2,attendees:[],teams:{},blocks:[]};
  d.blocks=autoBlocks(d);return d;
}
function loadDraft(date){
  S.dirty=false;S.blocksEdited=false;S.pasteMsg='';
  const saved=S.sessions[date];
  if(saved){S.blocksEdited=true;return Object.assign({teams:{},attendees:[],blocks:[]},clone(saved))}
  return newDraft(date);
}
function drillBlock(x,mins){return {id:rid(),kind:'drill',name:x.name,category:x.category,minutes:mins??x.minutes}}
function autoBlocks(d){
  const kind=venueKind(d.venue);
  const total=toMin(d.end)-toMin(d.start);
  const lib=S.drills.filter(x=>x.auto&&(x.venues||[]).includes(kind)).sort(byOrder);
  const warm=lib.filter(x=>x.category==='warmup');
  const tail=lib.filter(x=>x.category==='admin');
  const fun=lib.filter(x=>x.category==='fun').slice(0,1);
  const sum=a=>a.reduce((s,x)=>s+(+x.minutes||0),0);
  let avail=total-sum(warm)-sum(tail)-sum(fun);
  const blocks=warm.map(x=>drillBlock(x));
  const mids=[];
  if(kind==='MPSH'){
    const n=Math.max(2,d.numTeams);
    const bats=lib.filter(x=>x.station&&x.category==='batting');
    const others=lib.filter(x=>x.station&&x.category!=='batting');
    let st=[...bats.slice(0,n-1),...others.slice(0,1)];
    for(const x of [...bats,...others]){if(st.length>=n)break;if(!st.includes(x))st.push(x)}
    if(st.length){
      const per=Math.max(5,Math.floor(avail/st.length/5)*5);
      mids.push({id:rid(),kind:'rotation',name:'Station rotation',per,stations:st.map(x=>x.name)});
      avail-=per*st.length;
    }
    lib.filter(x=>!x.station&&!['warmup','admin','fun'].includes(x.category)).forEach(x=>{if(avail>=x.minutes){mids.push(drillBlock(x));avail-=x.minutes}});
  }else{
    lib.filter(x=>!['warmup','admin','fun'].includes(x.category)).forEach(x=>{mids.push(drillBlock(x));avail-=x.minutes});
  }
  const funB=fun.map(x=>drillBlock(x));
  if(avail>0){
    const stretch=funB[0]||[...mids].reverse().find(b=>b.kind==='drill');
    if(stretch)stretch.minutes+=avail;
  }
  return [...blocks,...mids,...funB,...tail.map(x=>drillBlock(x))];
}
function balanceTeams(d){
  const n=d.numTeams;
  const ps=d.attendees.map(id=>S.members.find(m=>m.id===id)).filter(Boolean)
    .map(m=>({m,r:Math.random()})).sort((a,b)=>(b.m.level||0)-(a.m.level||0)||a.r-b.r).map(x=>x.m);
  const t={};
  if(d.evenGender){
    // greedy: fewest of this player's gender first, then lowest level total, then fewest players
    const g=Array.from({length:n},()=>({F:0,M:0,'':0,sum:0,n:0}));
    ps.forEach(m=>{const k=m.gender||'';let best=0;
      for(let i=1;i<n;i++){const a=g[i],b=g[best];if(a[k]<b[k]||(a[k]===b[k]&&(a.sum<b.sum||(a.sum===b.sum&&a.n<b.n))))best=i}
      t[m.id]=best;g[best][k]++;g[best].sum+=m.level||0;g[best].n++});
  }else ps.forEach((m,i)=>{const round=Math.floor(i/n),pos=i%n;t[m.id]=round%2?n-1-pos:pos});
  d.teams=t;
}
function teamOf(d,id){const t=d.teams[id];return (t==null||t>=d.numTeams)?null:t}
function smallestTeam(d){const c=Array(d.numTeams).fill(0);d.attendees.forEach(id=>{const t=teamOf(d,id);if(t!=null)c[t]++});return c.indexOf(Math.min(...c))}
function teamRoster(d,t){return d.attendees.map(id=>S.members.find(m=>m.id===id)).filter(m=>m&&teamOf(d,m.id)===t).sort((a,b)=>(b.level||0)-(a.level||0)||a.name.localeCompare(b.name))}
function present(d){return d.attendees.map(id=>S.members.find(m=>m.id===id)).filter(Boolean)}

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll('[data-tab]').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===S.view?'page':'false'));
  const mt=document.querySelector('[data-tab="members"]');if(mt)mt.innerHTML='Members'+(S.reqs.length?` <span class="badge">${S.reqs.length}</span>`:'');
  const app=$('#app');
  const so=$('#signout');if(so)so.hidden=!S.user;
  if(S.status==='loading')return;
  if(S.status==='noconfig'){app.innerHTML=`<section class="card"><h2>Connect Firebase</h2><p class="muted">Paste your Firebase web config into <code>js/firebase-config.js</code> and reload. The README has the steps.</p></section>`;return}
  if(S.status==='signin'){location.replace('index.html?next=coach');return}
  if(S.status==='denied'){const code=S.user&&S.user.uid;app.innerHTML=`<section class="card" style="max-width:520px"><h2>Not an exco yet</h2><p class="muted" style="margin:0">Only excos can open the planner. Send this code to the club owner, who can add you under Members, then Excos.</p><div class="codebox"><code>${esc(code)}</code><button data-act="copyCode" data-code="${esc(code)}">Copy</button></div><div class="row"><a class="btnlink" href="index.html">Go to my trainings</a><button class="ghost" data-act="signout">Use another account</button></div></section>`;return}
  const a=document.activeElement,fid=a&&a.id;let sel=null;
  try{if(a&&'selectionStart' in a)sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  const banner=S.readOnly?`<div class="banner">Your changes aren't being saved. Check that your email is on the exco list.</div>`:'';
  app.innerHTML=banner+(S.view==='members'?membersHTML():S.view==='drills'?drillsHTML():(S.planDate&&S.draft)?planHTML():calHTML());
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(sel&&sel[0]!=null)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

function planHTML(){
  const d=S.draft,kind=venueKind(d.venue);
  const total=toMin(d.end)-toMin(d.start);
  const planned=d.blocks.reduce((s,b)=>s+blockMin(b),0);
  const diff=total-planned;
  const ppl=present(d);
  const saved=S.sessions[d.date];
  const stateTxt=S.dirty?'Unsaved changes':saved?'Saved':'Not saved yet';
  const budget=diff===0?`<span class="pill good">Fills ${fmt(toMin(d.start))}–${fmt(toMin(d.end))}</span>`
    :diff>0?`<span class="pill warn">${diff} min unplanned</span>`:`<span class="pill bad">Over by ${-diff} min</span>`;

  const session=`<section class="card"><div class="card-h"><h2>Session</h2><span class="muted small">${esc(pretty(d.date))}</span></div>
    <div class="g2">
      <label class="f">Date<input type="date" id="f-date" data-f="date" value="${esc(d.date)}"></label>
      <label class="f">Venue<select id="f-venue" data-f="venue">${VENUES.map(v=>`<option value="${v.id}"${v.id===d.venue?' selected':''}>${esc(v.label)}</option>`).join('')}</select></label>
      <label class="f">Start<input type="time" id="f-start" data-f="start" value="${esc(d.start)}"></label>
      <label class="f">End<input type="time" id="f-end" data-f="end" value="${esc(d.end)}"></label>
    </div>
    <div style="display:grid;gap:6px"><label class="check"><input type="checkbox" id="f-pub" data-fb="published"${d.published?' checked':''}><span>Members can see this training and reply Yes or No</span></label>
      <label class="check"><input type="checkbox" id="f-tv" data-fb="teamsVisible"${d.teamsVisible?' checked':''}${d.published?'':' disabled'}><span>Show teams and game lineups to members</span></label></div>
    <div class="row"><span class="eyebrow">Teams</span><div class="seg" role="group" aria-label="Number of teams">${[2,3].map(n=>`<button data-act="teams" data-n="${n}" aria-pressed="${d.numTeams===n}">${n}</button>`).join('')}</div>
    <span class="muted small">${kind==='MPSH'?'MPSH usually runs 2 batting stations and 1 fielding.':'Field days run drills one after another.'}</span></div>
  </section>`;

  let attend;
  if(!S.members.length){
    attend=`<section class="card"><h2>Attendance</h2><div class="empty">No members yet. Add your roster with each player's level and positions, then tick who's coming here.<a href="#members">Add members</a></div></section>`;
  }else{
    const list=[...S.members].filter(m=>m.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
    const q=norm(S.attQ||''),af=S.attF||(d.attendees.length?'coming':'all');
    const shown=list.filter(m=>q?norm(m.name).includes(q):af==='coming'?d.attendees.includes(m.id):af==='yes'?(S.rsvps&&(S.rsvps[d.date]||{})[m.id]===true):true);
    attend=`<section class="card"><div class="card-h"><h2>Attendance</h2><div class="row" style="gap:4px"><span class="muted small">${ppl.length} of ${list.length} coming</span><button class="ghost" data-act="all">All in</button><button class="ghost" data-act="none">Clear</button></div></div>
      ${rsvpSummary(d,list)}
      <div class="att-bar"><input id="att-q" data-input="attQ" value="${esc(S.attQ||'')}" placeholder="Find a player" autocomplete="off" aria-label="Find a player">
        <div class="seg" role="group" aria-label="Show">${[['coming','Coming',ppl.length],['yes','Replied coming',list.filter(m=>(S.rsvps[d.date]||{})[m.id]===true).length],['all','All',list.length]].map(([k,l,n])=>`<button data-act="attF" data-v="${k}" aria-pressed="${!q&&af===k}">${l} <span class="muted">${n}</span></button>`).join('')}</div></div>
      <div class="chips att">${shown.map(m=>{const rv=(S.rsvps[d.date]||{})[m.id];return `<button class="chip" data-act="toggle" data-id="${esc(m.id)}" aria-pressed="${d.attendees.includes(m.id)}">${rsMark(d.date,m.id)}${esc(m.name)}<span class="lvl">L${m.level||'?'}</span></button>`}).join('')}</div>
      ${shown.length?'':`<p class="small muted" style="margin:0">${q?'No player matches that name.':af==='coming'?'Nobody ticked yet. Pick All to choose players.':'Nobody here yet.'}</p>`}
      <details${S.paste?' open':''}><summary class="small">Paste names from a Telegram poll</summary>
        <div style="display:grid;gap:8px"><textarea id="paste" data-input="paste" placeholder="One name per line, as they appear in the poll voters list">${esc(S.paste)}</textarea>
        <div class="row"><button data-act="paste">Mark these present</button><span class="small muted">${esc(S.pasteMsg)}</span></div></div>
      </details>
    </section>`;
  }

  let teams='';
  if(ppl.length){
    const overall=avg(ppl.map(m=>m.level||0));
    teams=`<section class="card"><div class="card-h"><h2>Teams</h2><div class="row"><label class="check small"><input type="checkbox" id="f-eg" data-f="evenGender"${d.evenGender?' checked':''}><span>Even out genders</span></label><button data-act="balance">Balance teams</button></div></div>
      <div class="teams">${Array.from({length:d.numTeams},(_,t)=>{const r=teamRoster(d,t);const a=avg(r.map(m=>m.level||0));
        return `<div class="team t${t}"><div class="team-h"><h3>Team ${TEAM[t]}</h3><span class="small muted">${r.length} players${gCount(r)}</span></div>
        <div><div class="row small" style="justify-content:space-between"><span class="muted">Avg level</span><b style="font-family:var(--mono)">${r.length?a.toFixed(1):'–'}</b></div><div class="meter"><i style="width:${a/5*100}%"></i></div></div>
        <div class="plist">${r.map(m=>`<button data-act="move" data-id="${esc(m.id)}" title="Move to the next team"><span>${esc(m.name)} <span class="pos">${esc([m.gender,...(m.pos||[])].filter(Boolean).join(' '))}</span></span><span class="lvl">L${m.level||'?'}</span></button>`).join('')||'<span class="small muted">Nobody yet</span>'}</div></div>`}).join('')}</div>
      <p class="small muted" style="margin:0">Squad average ${overall.toFixed(1)}${gCount(ppl)}. Tap a player to move them to the next team.</p>
    </section>`;
  }

  let t=toMin(d.start);
  const rows=d.blocks.map((b,i)=>{const s=t;t+=blockMin(b);const e=t;
    const ctrl=`<div class="ctrl"><button class="ghost" data-act="up" data-i="${i}" aria-label="Move up"${i===0?' disabled':''}>↑</button><button class="ghost" data-act="down" data-i="${i}" aria-label="Move down"${i===d.blocks.length-1?' disabled':''}>↓</button><button class="ghost danger" data-act="del" data-i="${i}" aria-label="Remove">✕</button></div>`;
    if(b.kind!=='rotation')return `<div class="blk"><span class="time">${fmt(s)}–${fmt(e)}</span><span class="bn">${esc(b.name)}<small>${esc(CAT[b.category]||'')}</small></span>
      <div class="row" style="gap:6px;justify-content:flex-end"><label class="mins"><input type="number" min="0" step="5" id="m-${b.id}" data-bf="minutes" data-i="${i}" value="${b.minutes}" aria-label="Minutes for ${esc(b.name)}">min</label>${ctrl}</div></div>`;
    const ns=b.stations.length;
    const used=new Set(b.stations);
    const opts=S.drills.filter(x=>(x.venues||[]).includes(kind)&&!['warmup','admin'].includes(x.category)&&!used.has(x.name)).sort(byOrder);
    const table=ns?`<div class="rtable"><table><thead><tr><th>Round</th>${Array.from({length:d.numTeams},(_,k)=>`<th><span class="tdot t${k}"></span>Team ${TEAM[k]}</th>`).join('')}</tr></thead><tbody>
      ${b.stations.map((_,r)=>`<tr><td class="time">${fmt(s+r*b.per)}–${fmt(s+(r+1)*b.per)}</td>${Array.from({length:d.numTeams},(_,k)=>`<td>${esc(b.stations[(k+r)%ns])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`:'<span class="small muted">Add at least one station.</span>';
    return `<div class="blk rot"><div class="rot-h"><span class="time">${fmt(s)}–${fmt(e)}</span><span class="bn">${esc(b.name)}<small>${ns} rounds, every team visits every station</small></span>
      <div class="row" style="gap:6px;justify-content:flex-end"><label class="mins"><input type="number" min="5" step="5" id="p-${b.id}" data-bf="per" data-i="${i}" value="${b.per}" aria-label="Minutes per round">min/round</label>${ctrl}</div></div>
      <div class="stations">${b.stations.map((n,j)=>`<span class="st">${esc(n)}<button data-act="stdel" data-i="${i}" data-j="${j}" aria-label="Remove ${esc(n)}">✕</button></span>`).join('')}
        ${opts.length?`<select id="sa-${b.id}" data-act-change="stadd" data-i="${i}" aria-label="Add a station"><option value="">+ Station</option>${opts.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`:''}</div>
      ${table}</div>`;
  }).join('');
  const addOpts=[...S.drills].sort((a,b)=>((a.venues||[]).includes(kind)?0:1)-((b.venues||[]).includes(kind)?0:1)||byOrder(a,b));
  const issues=slotIssues(d);
  const warn=issues.length?`<div class="banner bad" role="alert"><b>Over the venue booking.</b> ${issues.map(esc).join(' ')}</div>`:'';
  const timeline=`<section class="card"><div class="card-h"><h2>Timeline</h2>${budget}</div>${warn}
    ${d.blocks.length?`<div class="tl">${rows}</div>`:`<div class="empty">${S.drills.length?'No blocks yet. Build one from your usual drills or add drills below.':'Add your drills in the Drills tab, then build the plan from them.'}${S.drills.length?'':'<a href="#drills">Add drills</a>'}</div>`}
    <div class="addbar"><select id="add-drill" aria-label="Drill to add"><option value="">Add a drill…</option>${addOpts.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${x.minutes} min</option>`).join('')}</select><button data-act="add">Add</button><button data-act="addrot">Add rotation</button></div>
    <div class="row"><button data-act="rebuild">${S.confirm==='rebuild'?'Tap again to replace the timeline':'Rebuild from usual drills'}</button></div>
  </section>`;


  const actions=`<div class="actions"><span class="st-txt">${esc(pretty(d.date))} · ${stateTxt}${issues.length?' · <b style="color:var(--bad)">runs past the booking</b>':''}</span>
    ${saved?`<button class="ghost danger" data-act="delsess">${S.confirm==='delsess'?'Tap again to delete':'Delete'}</button>`:''}
    <button data-act="copy">Copy for Telegram</button><button class="primary" data-act="save"${S.readOnly?' disabled':''}>Save plan</button></div>`;

  const back=`<div class="plan-top"><button data-act="backCal">← Calendar</button><span class="muted small">${esc(pretty(d.date))}${saved?(d.published?' · members can see it':' · only excos can see it'):' · new plan'}</span></div>`;
  return `${back}<div class="cols"><div class="stack">${session}${attend}${teams}</div><div class="stack">${timeline}</div></div>${gameHTML(d)}${actions}`;
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function calHTML(){
  const [y,mo]=S.calMonth.split('-').map(Number);
  const first=new Date(y,mo-1,1),lead=(first.getDay()+6)%7,days=new Date(y,mo,0).getDate();
  const today=iso(new Date());
  const cells=[];for(let i=0;i<lead;i++)cells.push('<span class="cd blank"></span>');
  for(let n=1;n<=days;n++){const date=`${y}-${String(mo).padStart(2,'0')}-${String(n).padStart(2,'0')}`;const x=S.sessions[date];const wd=dow(date);
    const cls=['cd',x?'has':'',x&&x.published?'pub':'',(wd===3||wd===5)?'tday':'',date===today?'today':'',S.draft&&S.dirty&&S.draft.date===date?'unsaved':''].filter(Boolean).join(' ');
    cells.push(`<button class="${cls}" data-act="calPick" data-date="${date}" aria-pressed="${S.calSel===date}" aria-label="${esc(pretty(date))}${x?', has a plan':''}"><span class="cd-n">${n}</span>${x?`<span class="cd-v">${esc(x.venue||'')}</span>`:''}</button>`)}
  const grid=`<section class="card cal"><div class="card-h"><h2>${MONTHS[mo-1]} ${y}</h2><div class="row" style="gap:4px"><button class="ghost" data-act="calMove" data-n="-1" aria-label="Previous month">‹</button><button class="ghost" data-act="calToday">Today</button><button class="ghost" data-act="calMove" data-n="1" aria-label="Next month">›</button></div></div>
    <div class="cal-g">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span class="cal-h">${d}</span>`).join('')}${cells.join('')}</div>
    <div class="cal-key small muted"><span><i class="k has"></i>Plan saved</span><span><i class="k pub"></i>Members can see it</span><span><i class="k tday"></i>Usual training day</span></div></section>`;
  const sel=S.calSel,x=sel&&S.sessions[sel];
  let panel;
  if(!sel)panel='';
  else if(x){const rv=S.rsvps[sel]||{};const yes=Object.values(rv).filter(v=>v===true).length,no=Object.values(rv).filter(v=>v===false).length,late=Object.values(S.rinfo[sel]||{}).filter(v=>v.status==='late'||v.status==='early').length;
    panel=`<section class="card"><div class="card-h"><h2>${esc(pretty(sel))}</h2>${x.published?'<span class="pill good">Members can see it</span>':'<span class="pill warn">Only excos</span>'}</div>
      <div class="cal-sum"><span>${esc(venueLabel(x.venue))}</span><span>${fmt(toMin(x.start))}–${fmt(toMin(x.end))}</span><span>${(x.attendees||[]).length} ticked as coming</span>${x.published?`<span>${yes} coming${late?` (${late} late or leaving early)`:''} · ${no} can't</span>`:''}</div>
      <div class="row"><button class="primary" data-act="openPlan" data-date="${sel}">View plan</button></div></section>`}
  else panel=`<section class="card"><h2>${esc(pretty(sel))}</h2><p class="muted" style="margin:0">No plan for this day yet.${(dow(sel)===3||dow(sel)===5)?'':' It isn\'t a usual training day.'}</p><div class="row"><button class="primary" data-act="openPlan" data-date="${sel}">Make a plan</button></div></section>`;
  const today2=iso(new Date());
  const up=Object.values(S.sessions).filter(v=>v.date>=today2).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const upcoming=`<section class="card"><h2>Coming up</h2>${up.length?`<div class="saved">${up.map(v=>`<button data-act="calPick" data-date="${v.date}" aria-current="${v.date===sel}"><span>${esc(pretty(v.date))} · ${esc(venueLabel(v.venue))}</span><span class="muted small">${v.published?'posted':'draft'}</span></button>`).join('')}</div>`:'<p class="muted small" style="margin:0">No upcoming plans. Pick a day on the calendar to make one.</p>'}</section>`;
  const unsaved=S.draft&&S.dirty?`<div class="banner">You have unsaved changes on ${esc(pretty(S.draft.date))}. <button class="ghost" data-act="openPlan" data-date="${S.draft.date}">Go back to it</button></div>`:'';
  const waiting=S.reqs.length?`<div class="banner">${S.reqs.length} ${S.reqs.length===1?'person is':'people are'} waiting to be linked to their name. <a href="#members">Review in Members</a></div>`:'';
  return `${waiting}${unsaved}<div class="cols"><div class="stack">${grid}</div><div class="stack">${lastMinuteHTML()}${panel}${upcoming}</div></div>`;
}

function gCount(r){const f=r.filter(m=>m.gender==='F').length,m=r.filter(m=>m.gender==='M').length;return (f||m)?` · ${f}F ${m}M`:''}
// A member's reply: status is yes, late, early or no (older replies only have going).
function reply(date,id){const v=(S.rinfo[date]||{})[id];if(!v)return null;return {...v,status:v.status||(v.going?'yes':'no')}}
const STATUS={yes:'Coming',late:'Coming late',early:'Leaving early',no:"Can't make it"};
function replyNote(r){return [r.time&&(r.status==='late'?'arrives ':r.status==='early'?'leaves ':'')+fmt(toMin(r.time)),r.reason].filter(Boolean).join(' · ')}
function rsMark(date,id){const r=reply(date,id);if(!r)return '';const note=esc(STATUS[r.status]+(replyNote(r)?': '+replyNote(r):''));
  return r.status==='yes'?`<span class="rs yes" title="${note}">✓</span>`:r.status==='late'?`<span class="rs late" title="${note}">L</span>`:r.status==='early'?`<span class="rs late" title="${note}">E</span>`:`<span class="rs no" title="${note}">✕</span>`}
function rsvpSummary(d,list){
  const rv=S.rsvps[d.date]||{};const yes=list.filter(m=>rv[m.id]===true),no=list.filter(m=>rv[m.id]===false);
  if(!d.published&&!yes.length&&!no.length)return `<p class="small muted" style="margin:0">Tick "Members can see this training" and save to open the poll in the member view.</p>`;
  const missing=yes.filter(m=>!d.attendees.includes(m.id)).length;
  const notes=list.map(m=>({m,r:reply(d.date,m.id)})).filter(x=>x.r&&(x.r.status!=='yes'&&(x.r.reason||x.r.time||x.r.status!=='no')));
  const late=notes.filter(x=>x.r.status==='late').length,early=notes.filter(x=>x.r.status==='early').length;
  return `<div class="row small"><span class="pill good">${yes.length} coming</span>${late?`<span class="pill warn">${late} late</span>`:''}${early?`<span class="pill warn">${early} leaving early</span>`:''}<span class="pill bad">${no.length} can't</span><span class="muted">${list.length-yes.length-no.length} no reply</span>${missing?`<button data-act="rsvpYes">Tick the ${missing} who are coming</button>`:''}</div>
    ${notes.length?`<details><summary class="small">Late, leaving early and reasons (${notes.length})</summary><div class="list notes">${notes.sort((a,b)=>a.m.name.localeCompare(b.m.name)).map(({m,r})=>`<div class="li"><div><div class="nm">${esc(m.name)} <span class="pill ${r.status==='no'?'bad':'warn'}" style="padding:0 6px;font-size:11px">${esc(STATUS[r.status])}</span>${r.prev&&r.prev!==r.status?` <span class="small muted">was ${esc(STATUS[r.prev].toLowerCase())}</span>`:''}</div>${replyNote(r)?`<div class="small muted">${esc(replyNote(r))}</div>`:''}</div></div>`).join('')}</div></details>`:''}`;
}
// Replies changed in the 24 hours before a training starts, for trainings in the next 2 days.
function lastMinute(){
  const now=Date.now(),out=[];
  for(const x of Object.values(S.sessions)){if(!x.published)continue;const st=new Date(x.date+'T'+(x.start||'15:30')+':00').getTime();if(st<now-3*3600e3||st>now+48*3600e3)continue;
    for(const [id,v] of Object.entries(S.rinfo[x.date]||{})){const at=Date.parse(v.at);if(!(at>=st-24*3600e3))continue;const r=reply(x.date,id);if(r.status==='yes'&&!r.prev)continue;
      const m=S.members.find(m=>m.id===id);if(m)out.push({x,m,r,at})}}
  return out.sort((a,b)=>b.at-a.at);
}
function lastMinuteHTML(){const l=lastMinute();if(!l.length)return '';
  return `<section class="card lastmin"><div class="card-h"><h2>Last-minute changes</h2><span class="small muted">in the 24 hours before training</span></div><div class="list">${l.slice(0,12).map(({x,m,r,at})=>`<div class="li"><div><div class="nm">${esc(m.name)} <span class="pill ${r.status==='no'?'bad':r.status==='yes'?'good':'warn'}" style="padding:0 6px;font-size:11px">${esc(STATUS[r.status])}</span>${r.prev&&r.prev!==r.status?` <span class="small muted">was ${esc(STATUS[r.prev].toLowerCase())}</span>`:''}</div><div class="small muted">${esc(pretty(x.date))} · ${new Date(at).toLocaleString('en-SG',{weekday:'short',hour:'numeric',minute:'2-digit'})}${replyNote(r)?' · '+esc(replyNote(r)):''}</div></div></div>`).join('')}</div></section>`}
function dots(n){return `<span class="dots" aria-label="Level ${n} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`}

/* ---------- game lineups (one per team, stored in the session plan) ---------- */
const SLOTS=[['P','Pitcher',200,262],['C','Catcher',200,358],['1B','First base',300,240],['2B','Second base',256,178],['SS','Shortstop',144,178],['3B','Third base',100,240],['LF','Left field',74,104],['CF','Centre field',200,52],['RF','Right field',326,104],['R','Rover',200,122]];
const SLOTFIT={P:'P',C:'C','1B':'IF','2B':'IF','SS':'IF','3B':'IF',LF:'OF',CF:'OF',RF:'OF',R:'OF'};
const activeSlots=lu=>SLOTS.filter(x=>x[0]!=='R'||lu.useSF!==false);
const mem=id=>S.members.find(m=>m.id===id);
function shortName(n){n=String(n||'');if(n.includes(',')){const[a,b]=n.split(',');return b.trim()+' '+a.trim().split(' ')[0]}return n}
function LU(){const d=S.draft;if(!d.lineups)d.lineups={};if(S.luTeam>=d.numTeams)S.luTeam=0;const k=String(S.luTeam);if(!d.lineups[k])d.lineups[k]={slots:{},order:[],useSF:true};return d.lineups[k]}
function hasGame(d){return d.blocks.some(b=>b.category==='game')}
function poolPlayers(lu){
  const ps=teamRoster(S.draft,S.luTeam);
  Object.values(lu.slots).forEach(id=>{if(id&&!ps.some(m=>m.id===id)){const m=mem(id);if(m)ps.push(m)}});
  return ps.sort((a,b)=>a.name.localeCompare(b.name));
}
function onField(lu){return activeSlots(lu).map(x=>lu.slots[x[0]]).filter(id=>id&&mem(id))}
function battingOrder(lu){const f=onField(lu);return [...(lu.order||[]).filter(id=>f.includes(id)),...f.filter(id=>!(lu.order||[]).includes(id))]}
function assign(id,from,to){
  const sl=LU().slots;
  if(to==='bench'){if(from!=='bench')delete sl[from]}
  else{const occ=sl[to];for(const k in sl)if(sl[k]===id)delete sl[k];sl[to]=id;if(from!=='bench'&&from!==to&&occ&&occ!==id)sl[from]=occ}
  markDirty();
}
function fits(m,k){return (m.pos||[]).includes(SLOTFIT[k])}
function autoFill(lu){
  const used=new Set(onField(lu));
  const bench=()=>poolPlayers(lu).filter(m=>!used.has(m.id)).sort((a,b)=>(b.level||0)-(a.level||0));

/* drag and drop: mouse drags straight away, touch after a short hold so the page can still scroll */
function dropTarget(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const sl=el.closest('[data-slot]');if(sl)return sl;return el.closest('[data-bench]')}
function clearDrop(){document.querySelectorAll('.drop').forEach(e=>e.classList.remove('drop'))}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');if(!el||S.view!=='plan'||e.button>0)return;
  const d={id:el.dataset.drag,from:el.dataset.from,x:e.clientX,y:e.clientY,touch:e.pointerType==='touch',armed:false,ghost:null,pid:e.pointerId};
  if(d.touch)d.timer=setTimeout(()=>{d.armed=true;if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}startGhost(d,d.x,d.y)},280);
  S.drag=d;
});
function startGhost(d,x,y){const m=mem(d.id);const g=document.createElement('div');g.className='dragghost';g.textContent=m?shortName(m.name):'';document.body.appendChild(g);d.ghost=g;moveGhost(d,x,y)}
function moveGhost(d,x,y){d.ghost.style.left=x+'px';d.ghost.style.top=y+'px';clearDrop();const t=dropTarget(x,y);if(t)t.classList.add('drop')}
document.addEventListener('pointermove',e=>{const d=S.drag;if(!d||e.pointerId!==d.pid)return;
  const moved=Math.hypot(e.clientX-d.x,e.clientY-d.y);
  if(!d.armed){if(d.touch){if(moved>8){clearTimeout(d.timer);S.drag=null}return}if(moved<5)return;d.armed=true;startGhost(d,e.clientX,e.clientY);return}
  if(d.ghost)moveGhost(d,e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{if(S.drag&&S.drag.armed)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(S.drag&&S.drag.armed)e.preventDefault()});
function endDrag(e,cancel){const d=S.drag;if(!d||e.pointerId!==d.pid)return;clearTimeout(d.timer);S.drag=null;
  if(!d.armed)return;
  if(d.ghost)d.ghost.remove();
  const t=cancel?null:dropTarget(e.clientX,e.clientY);clearDrop();S.suppressClick=true;setTimeout(()=>S.suppressClick=false,60);
  if(!t)return;const to=t.dataset.slot||'bench';if(to===d.from)return;
  assign(d.id,d.from,to);S.sel=null;render();
}

let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
async function write(fn,ok){
  if(!S.db){toast('Sign in to save changes.');return false}
  try{await fn();if(ok)toast(ok);return true}
  catch(e){if(e&&(e.code==='permission-denied'||e.code==='invalid_argument')){S.readOnly=true;toast("This change wasn't saved. You may only have view access.")}
    else if(e&&e.code==='quota_exceeded')toast('Storage is full. Delete some old plans and try again.');
    else toast("Couldn't save just now. Try again in a moment.");render();return false}
}
function markDirty(){S.dirty=true}
let confirmT;
function armConfirm(key){if(S.confirm===key){S.confirm=null;return true}S.confirm=key;clearTimeout(confirmT);confirmT=setTimeout(()=>{S.confirm=null;render()},3500);render();return false}

function norm(s){return String(s).toLowerCase().replace(/^[\s\d.)\-•*·]+/,'').replace(/[^\p{L}\p{N}\s'-]/gu,'').replace(/\s+/g,' ').trim()}
function matchNames(text){
  const lines=text.split(/[\n,]+/).map(norm).filter(Boolean);
  const ms=S.members.map(m=>({m,n:norm(m.name)}));
  const hit=[],miss=[];
  for(const l of lines){
    let c=ms.filter(x=>x.n===l);
    if(c.length!==1)c=ms.filter(x=>x.n.split(' ')[0]===l.split(' ')[0]);
    if(c.length!==1)c=ms.filter(x=>x.n.includes(l)||l.includes(x.n));
    if(c.length===1)hit.push(c[0].m.id);else miss.push(l);
  }
  return {hit,miss};
}

function planText(){
  const d=S.draft;const ppl=present(d);
  const out=[`Training · ${pretty(d.date)} · ${venueLabel(d.venue)} · ${fmt(toMin(d.start))}–${fmt(toMin(d.end))}`];
  if(ppl.length){out.push('');for(let t=0;t<d.numTeams;t++){const r=teamRoster(d,t);if(r.length)out.push(`Team ${TEAM[t]}: ${r.map(m=>m.name).join(', ')}`)}}
  out.push('');let t=toMin(d.start);
  for(const b of d.blocks){const s=t;t+=blockMin(b);
    if(b.kind!=='rotation'){out.push(`${fmt(s)}–${fmt(t)} ${b.name}`);continue}
    out.push(`${fmt(s)}–${fmt(t)} ${b.name}`);
    b.stations.forEach((_,r)=>out.push(`  ${fmt(s+r*b.per)} ` + Array.from({length:d.numTeams},(_,k)=>`${TEAM[k]}: ${b.stations[(k+r)%b.stations.length]}`).join(' | ')));
  }
  out.push(...lineupLines(S.draft));
  return out.join('\n');
}

  rsvpYes(){const d=S.draft,rv=S.rsvps[d.date]||{};S.members.forEach(m=>{if(rv[m.id]===true&&!d.attendees.includes(m.id)){d.attendees.push(m.id);d.teams[m.id]=smallestTeam(d)}});markDirty()},
  async signout(){await logOut();location.reload()},
  async mdel({id}){if(!armConfirm('m'+id))return;await write(async()=>{await S.db.doc('members/'+id).delete();await S.db.doc('roster/'+id).delete();const m=S.members.find(m=>m.id===id);if(m&&m.tg)await S.db.doc('tgIndex/'+m.tg).delete()},'Member removed');if(S.mf.id===id)S.mf=newMemberForm();render()},
  dvenue({v}){const a=S.df.venues;const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v)},
  dedit({id}){const x=S.drills.find(x=>x.id===id);if(x){S.df={id:x.id,name:x.name,minutes:x.minutes,category:x.category,venues:[...(x.venues||[])],station:!!x.station,auto:!!x.auto,notes:x.notes||'',order:x.order};scrollTo({top:0})}},
  dcancel(){S.df=newDrillForm()},
  async dsave(){const f=S.df;const name=f.name.trim();if(!name)return toast('Enter a drill name first.');if(!f.venues.length)return toast('Pick at least one venue.');
    const ref=f.id?S.db.doc('drills/'+f.id):S.db.collection('drills').doc();
    const order=f.id?(f.order??0):Math.max(0,...S.drills.map(x=>x.order||0))+1;
    if(await write(()=>ref.set({name,minutes:Math.max(0,+f.minutes||0),category:f.category,venues:f.venues,station:f.station,auto:f.auto,notes:f.notes.trim(),order}),f.id?'Drill updated':`${name} added`)){S.df=newDrillForm();render()}},
  async ddel({id}){if(!armConfirm('d'+id))return;await write(()=>S.db.doc('drills/'+id).delete(),'Drill removed');if(S.df.id===id)S.df=newDrillForm();render()},
};

Object.assign(A,A_LU);
document.addEventListener('click',e=>{
  if(S.suppressClick){S.suppressClick=false;return}
  const el=e.target.closest('[data-act]');if(!el||el.disabled||el.tagName==='SELECT')return;
  const fn=A[el.dataset.act];if(!fn)return;
  const r=fn(el.dataset,el);if(!(r instanceof Promise))render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.input;if(!k)return;
  if(k==='attQ'){S.attQ=e.target.value;render();return}
  if(k==='paste')S.paste=e.target.value;
  else if(k==='exCode'||k==='exName'||k==='tgPaste')S[k]=e.target.value;
  else{const [o,f]=k.split('.');S[o][f]=e.target.value}
});
document.addEventListener('change',e=>{
  const el=e.target,d=S.draft;
  if(el.dataset.fb){d[el.dataset.fb]=el.checked;if(el.dataset.fb==='published'&&!el.checked)d.teamsVisible=false;markDirty();render();return}
  if(el.id==='import-file'&&el.files[0]){importBackup(el.files[0]);return}
  if(el.dataset.exPick){const tg=el.value;if(tg){const mid=Object.keys(S.links).find(k=>S.links[k]===tg);const m=S.members.find(m=>m.id===mid);S.exCode=tg;S.exName=m?m.name:''}render();return}
  if(el.dataset.f==='evenGender'){d.evenGender=el.checked;balanceTeams(d);markDirty();render();return}
  if(el.dataset.f){const k=el.dataset.f,v=el.value;if(!v)return;
    if(k==='date'){history.replaceState(null,'','#plan/'+v);S.planDate=v;S.calSel=v;S.calMonth=v.slice(0,7);S.draft=loadDraft(v)}
    else{d[k]=v;if(k==='venue'){const want=venueKind(v)==='MPSH'?3:2;if(!S.blocksEdited){d.numTeams=want;balanceTeams(d)}}
      if(!S.blocksEdited)d.blocks=autoBlocks(d);markDirty()}
    render();return}
  if(el.dataset.bf){const b=d.blocks[+el.dataset.i];b[el.dataset.bf]=Math.max(0,Math.round(+el.value||0));S.blocksEdited=true;markDirty();render();return}
  if(el.dataset.actChange==='stadd'){if(el.value){d.blocks[+el.dataset.i].stations.push(el.value);S.blocksEdited=true;markDirty()}render();return}
  if(el.dataset.lf){const lu=LU(),k=el.dataset.lf;lu[k]=el.checked;if(k==='useSF'&&!el.checked)delete lu.slots.R;markDirty();render();return}
  if(el.dataset.lslot){const k=el.dataset.lslot,id=el.value;const sl=LU().slots;const cur=Object.keys(sl).find(x=>sl[x]===id);if(id){assign(id,cur||'bench',k)}else{delete sl[k];markDirty()}render();return}
  if(el.dataset.dchange){const k=el.dataset.dchange;S.df[k]=el.type==='checkbox'?el.checked:el.value;return}
});

function route(){const [v,date]=location.hash.slice(1).split('/');S.view=['plan','members','drills'].includes(v)?v:'plan';
  S.planDate=S.view==='plan'&&/^\d{4}-\d{2}-\d{2}$/.test(date||'')?date:null;S.sel=null;S.confirm=null;
  if(S.planDate){S.calSel=S.planDate;S.calMonth=S.planDate.slice(0,7);syncDraft()}
  render();if(S.planDate)scrollTo({top:0})}
const dataReady=()=>S.ready.m&&S.ready.d&&S.ready.s;
function syncDraft(){if(S.planDate&&dataReady()&&(!S.draft||S.draft.date!==S.planDate))S.draft=loadDraft(S.planDate)}
window.addEventListener('hashchange',route);

function afterData(){
  if(!(S.ready.m&&S.ready.d&&S.ready.s))return;
  syncDraft();
  if(S.draft){
    if(!S.dirty&&S.sessions[S.draft.date])S.draft=loadDraft(S.draft.date);
    else if(!S.dirty&&!S.blocksEdited&&!S.sessions[S.draft.date])S.draft.blocks=autoBlocks(S.draft);
    // drop attendees whose member was deleted
    S.draft.attendees=S.draft.attendees.filter(id=>S.members.some(m=>m.id===id));
  }
  S.status='ok';render();
}

async function importBackup(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){return toast("That file isn't a planner backup.")}
  const ms=data.members||[],ds=data.drills||[];let n=0;
  for(const m of ms){const {id,...rest}=m;if(rest.tg)rest.tg=tgNorm(rest.tg);if(!await write(async()=>{await S.db.doc('members/'+id).set(rest);await S.db.doc('roster/'+id).set({name:rest.name});if(rest.tg)await setTgIndex(id,null,rest.tg)}))return;n++}
  for(const x of ds){const {id,...rest}=x;if(!await write(()=>S.db.doc('drills/'+id).set(rest)))return}
  toast(`Imported ${n} members and ${ds.length} drills`);
}
// tgIndex/<username> lets a Telegram login find its own member, and nothing else.
async function setTgIndex(id,oldTg,tg){if(oldTg&&oldTg!==tg)await S.db.doc('tgIndex/'+oldTg).delete().catch(()=>{});if(tg)await S.db.doc('tgIndex/'+tg).set({memberId:id})}
let rosterSynced=false;
async function syncRoster(){
  // members can only read names, so keep roster/{id} in step with members/{id}
  if(rosterSynced||!S.ready.r)return;rosterSynced=true;
  for(const m of S.members){if(S.roster[m.id]!==m.name)await S.db.doc('roster/'+m.id).set({name:m.name}).catch(()=>{})}
}
function start(){
  S.status='loading';render();S.db=db;
  const fail=e=>{if(e&&e.code==='permission-denied'){S.status='denied';render()}};
  db.collection('members').onSnapshot(s=>{S.members=s.docs.map(x=>({id:x.id,...x.data()}));S.ready.m=1;afterData();syncRoster()},fail);
  db.collection('drills').onSnapshot(s=>{S.drills=s.docs.map(x=>({id:x.id,...x.data()}));S.ready.d=1;afterData()},fail);
  db.collection('sessions').onSnapshot(s=>{S.sessions=Object.fromEntries(s.docs.map(x=>[x.id,x.data()]));S.ready.s=1;afterData()},fail);
  db.collection('roster').onSnapshot(s=>{S.roster=Object.fromEntries(s.docs.map(x=>[x.id,x.data().name]));S.ready.r=1;syncRoster()},fail);
  db.collection('claims').onSnapshot(s=>{const o={};s.docs.forEach(x=>{const v=x.data();if(x.id.startsWith('tg:'))o[v.memberId]=x.id});S.links=o;if(S.status==='ok')render()},()=>{});
  db.collection('linkRequests').onSnapshot(s=>{S.reqs=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.at).localeCompare(String(b.at)));if(S.status==='ok')render()},()=>{});
  db.collection('admins').onSnapshot(s=>{S.admins=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(adminName(a)||a.id).localeCompare(adminName(b)||b.id));if(S.status==='ok')render()},()=>{});
  db.collection('rsvps').onSnapshot(s=>{const o={},inf={};s.docs.forEach(x=>{const v=x.data();(o[v.date]=o[v.date]||{})[v.memberId]=v.going;(inf[v.date]=inf[v.date]||{})[v.memberId]=v});S.rsvps=o;S.rinfo=inf;if(S.status==='ok')render()},fail);
}
(async()=>{
  route();
  if(!configured){S.status='noconfig';render();return}
  S.user=await currentUser();
  if(!S.user||S.user.isAnonymous){S.status='signin';render();return}
  start();
})();
</script>
