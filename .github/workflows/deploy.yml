# Puts the site live when something is merged into main.
# Firestore rules are not deployed here: deploy them yourself with `firebase deploy --only firestore:rules`.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (README, "Deploy on merge").
name: Deploy site
on:
  push:
    branches: [main]
    paths: [public/**, firebase.json]
  workflow_dispatch:
concurrency: deploy
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: softball-training-a2e32
          channelId: live
