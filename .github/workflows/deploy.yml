# Puts the site live when something is merged into main.
# Firestore rules are not deployed here: deploy them yourself with `firebase deploy --only firestore:rules`.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (README, "Deploy on merge").
name: Deploy site
on:
  push:
    branches: [main]
    paths: [public/**, firebase.json]
  workflow_dispatch:
concurrency: deploy
jobs:
  hosting:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      # Without the secret there's nothing to deploy with: skip with a note instead of failing.
      - if: env.HAS_KEY != 'true'
        run: echo "::warning::Not deployed. Add the FIREBASE_SERVICE_ACCOUNT secret (README, Deploy on merge) to turn on auto-deploy."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: softball-training-a2e32
          channelId: live
